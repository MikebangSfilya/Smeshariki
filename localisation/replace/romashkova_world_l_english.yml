 RDC_central_crisis_desc:0 "Жители требуют права самостоятельно решать судьбу своих земель. Совет готовит передачу полномочий."
 RDC_valley_breakup:0 "Распад Ромашковой долины"
 RDC_valley_breakup_desc:0 "Общий союз прекращает существование. Девять стран становятся независимыми, а Совет сохраняет центральные земли."
 smesh_world.1.t:0 "Распад Ромашковой долины"
 smesh_world.1.d:0 "Совет передаёт полномочия жителям. Крош, Ёжик, Нюша, Бараш, Лосяш, Совунья, Копатыч, Пин и Кар-Карыч становятся независимыми правителями своих земель. Общий союз распущен. Совет сохраняет центральную территорию, а Миссия НАТО наблюдает за переменами."
 smesh_world.1.a:0 "Каждая страна выбирает свой путь."
