l_russian:
 KRO_project_skameika:0 "Проект С.К.А.М.Е.Й.К.А"
 KRO_project_skameika_desc:0 "Долине необходимо постоянное место для отдыха и общественных встреч. Подготовка площадки, заготовка древесины и доставка материалов потребуют согласованной работы жителей. Установленный срок должен быть выдержан: завершение проекта станет свидетельством того, что организованный труд способен обеспечить потребности всей долины."
 KRO_project_skameika_tt:0 "Завершить строительство скамейки. Жители долины получат +3% стабильности, Крош — 25 политической власти. Литературный результат получат все активные страны."
 KRO_property_dispute:0 "Вопрос о собственности"
 KRO_property_dispute_desc:0 "Совет намерен включить скамейку в состав общественного имущества, ссылаясь на участие жителей в строительстве и значение объекта для общего досуга. Вместе с Ёжиком мы потребуем сохранить первоначальное право собственности. Свободный доступ к результатам личного труда не означает передачи права распоряжаться ими."
 KRO_property_dispute_tt:0 "Протест Кроша и Ёжика будет отклонён. Совет перенесёт скамейку на общественную площадку возле дома Ёжика без его согласия. Все активные страны получат литературную запись."
 KRO_leave_council:0 "Прекратить участие в Совете"
 KRO_leave_council_desc:0 "Орган, призванный согласовывать интересы жителей, подтвердил решение, нарушающее наши права. Продолжение участия в его работе означало бы признание установленного порядка. Мы отзовём своё представительство и сосредоточимся на собственных землях. Общие обязательства пока сохраняются, но право Совета говорить от нашего имени больше не признаётся."
 KRO_leave_council_tt:0 "Крош покинет заседания Совета и вернётся домой. Его зависимость от Совета и членство в общем союзе сохранятся до распада долины. Личную литературную запись получит только Крош."
 KRO_reclaim_bench:0 "Урегулирование скамеечного вопроса"
 KRO_reclaim_bench_desc:0 "Переговоры не привели к восстановлению наших прав. Сторонники Кроша покинут северный участок, который будет передан Совету, и сосредоточатся у площадки со скамейкой. Мы установим контроль над прилегающей территорией и предложим признать новую границу окончательным урегулированием спора."
 KRO_reclaim_bench_tt:0 "Передать северо-восточную область Совету и занять южные области Ёжика со скамейкой. Дом Ёжика останется вне захвата. Все активные страны получат литературную запись."
 KRO_security_guarantees:0 "Гарантии безопасности"
 KRO_security_guarantees_desc:0 "Прекращение общего управления оставит жителей без согласованных правил защиты и снабжения. Ёжику будет предложено соглашение о передаче военных и внешнеполитических полномочий Крошу. Одновременно наши силы выдвинутся к дальнему огороду Копатыча, контроль над которым рассматривается как необходимое условие устойчивого продовольственного снабжения."
 KRO_security_guarantees_tt:0 "После общего распада одновременно направить предложение Ёжику и начать пограничный конфликт за дальний огород. Согласие Ёжика сделает его марионеткой Кроша, отказ приведёт к войне. Огород перейдёт Крошу только при победе. Дипломатические записи получат участники каждой линии."
 smesh_fixed_breakup_tt:0 "Общий союз прекратит существование через 70 дней после начала новой партии, независимо от выбора фокусов."
 smesh_ezh_accept_tt:0 "Ёжик станет марионеткой Кроша. Уже занятые Крошем земли не будут возвращены."
 smesh_ezh_refuse_tt:0 "Крош объявит войну Ёжику. Пограничный конфликт с Копатычем развивается отдельно."
 smesh_former_bench_site:0 "Площадка строительства"
 smesh_bench_name:0 "С.К.А.М.Е.Й.К.А"
 smesh_krosh.101.t:0 "Открытие С.К.А.М.Е.Й.К.А"
 smesh_krosh.101.d:0 "Последние работы закончились незадолго до полудня. С площадки убрали оставшиеся доски, инструменты вернули владельцам, а у подхода уложили камни, чтобы после дождя дорога оставалась проходимой. Крош ещё раз осмотрел крепления и сообщил Ёжику, что открытие откладывать больше не придётся.\n\nСтроительство заняло значительно больше сил, чем предполагалось. Доставку древесины несколько раз задерживала непогода. Часть заготовок пришлось заменить, а подготовку основания начать заново. Копатыч предоставил материалы, Пин помог с инструментами, остальные жители по очереди участвовали в работах. Крош оставался на площадке до вечера даже в те дни, когда остальных уже отпускали домой.\n\nК открытию собрались почти все. Ёжик зачитал сообщение о выполнении строительного плана и передал Крошу записи о расходах. Затем ограждение сняли. Жители задержались здесь и после окончания церемонии: обсуждали новости, договаривались о совместных работах, отдыхали перед возвращением домой.\n\nВечером Крош сложил строительные записи в отдельную папку. На её обложке по-прежнему значилось его имя. В протоколе Совета, составленном в тот же день, завершённый проект был внесён в перечень объектов общественного значения."
 smesh_krosh.101.a:0 "Наш труд принёс пользу долине."
 smesh_krosh.102.t:0 "Постановление принято"
 smesh_krosh.102.d:0 "Секретарь Совета зачитал постановление о национализации скамейки и прилегающей общественной площадки. Документ предписывал принять объект на общественный учёт, провести опись имущества и передать его обслуживание назначенным исполнителям. Основанием были названы участие жителей в строительстве и необходимость обеспечить равный доступ.\n\nЁжик представил возражения и строительные записи. Крош подтвердил, что доступ к скамейке останется свободным, но потребовал исключить из постановления передачу права собственности. Председатель признал их вклад в строительство и сообщил, что общественное назначение объекта имеет преимущественное значение.\n\nПротест отклонили. Пока Крош продолжал требовать пересмотра решения, подписанные экземпляры уже передали исполнителям. К вечеру скамейку вывезли на общественную площадку возле дома Ёжика. Согласия хозяина соседних земель не запрашивали.\n\nНа прежнем месте остались следы креплений и строительное ограждение. Крош забрал папку с документами и покинул площадку, отказавшись подписывать акт передачи."
 smesh_krosh.102.a:0 "Постановление вступило в силу."
 smesh_krosh.103.t:0 "Прекращение участия"
 smesh_krosh.103.d:0 "На последнем заседании Крош передал председателю заявление о прекращении своего участия в работе Совета. Он потребовал внести в протокол, что решение о национализации считает неправомерным и не признаёт за Советом права распоряжаться его собственностью. Председатель предложил продолжить обсуждение в установленном порядке. Крош оставил заявление на столе и вышел из зала.\n\nДома он сложил документы Совета в отдельный ящик. Ёжик пришёл вечером и попытался убедить его вернуться к переговорам. Крош выслушал друга, но ответил, что участие в заседаниях теперь лишь придаёт законность решениям, принятым без его согласия.\n\nПосле ухода Ёжика дверь была заперта. Общий союз ещё существовал, обязательства перед центром формально сохранялись, и никто не объявлял об отделении. Однако место Кроша на следующем заседании осталось пустым. Новые обращения Совета доставляли к закрытому дому."
 smesh_krosh.103.a:0 "Совет больше не представляет наши интересы."
 smesh_krosh.104.t:0 "Сложившееся положение"
 smesh_krosh.104.d:0 "Переселение сторонников Кроша с северного участка завершилось к рассвету. Представителям Совета передали оставшиеся документы и сообщили, что дальнейшее управление территорией переходит к центру. К этому времени основные отряды уже двигались к площадке возле дома Ёжика.\n\nЁжик вышел навстречу, когда у дороги начали устанавливать новые пограничные знаки. Обозначенная линия проходила далеко за пределами скамейки. На требование объяснить происходящее ему предъявили распоряжение Кроша об установлении единого управления над площадкой и прилегающими землями. Дом Ёжика остался за новой границей.\n\nВ направленном соседям обращении Крош заявил, что возвращение имущества восстановило нарушенные права. Передача северного участка была представлена как уступка ради общего урегулирования. Он предложил признать установленную границу и заверил, что с её признанием спор будет исчерпан.\n\nСовет воздержался от вмешательства. Ёжик направил протест, но отряды Кроша уже закрепились на занятой территории. Скамейка оставалась на прежней площадке; изменилось управление землями вокруг неё."
 smesh_krosh.104.a:0 "В долине установлена новая граница."
 smesh_krosh.105.t:0 "Предложение о защите направлено"
 smesh_krosh.105.d:0 "После прекращения общего управления долиной Крош распорядился подготовить соглашение о безопасности с Ёжиком. Документ сохраняет за соседом местное управление, но передаёт Крошу полномочия по обороне и внешним отношениям. Занятая ранее территория признаётся частью его владений.\n\nПредставители Кроша доставили соглашение к дому Ёжика. Им поручено получить определённый ответ: принятие условий обеспечит переход к совместному управлению обороной, отказ будет расценён как невозможность дальнейшего мирного урегулирования.\n\nОдновременно отряды выдвинулись к дальнему огороду Копатыча. Вопрос продовольственного снабжения рассматривается отдельно и не зависит от исхода переговоров с Ёжиком."
 smesh_krosh.105.a:0 "Ожидаем ответа."
 smesh_krosh.106.t:0 "Предложение Кроша"
 smesh_krosh.106.d:0 "Посланники Кроша принесли подготовленный текст соглашения. Ёжик прочитал его за тем же столом, где недавно они вместе составляли протест против национализации. На этот раз документ касался не отдельного имущества, а права самостоятельно распоряжаться своими землями.\n\nКрош предлагает взять на себя защиту владений Ёжика. В обмен он требует передать ему управление обороной и внешними отношениями, а также признать границу, установленную после занятия южного участка. Возвращения этих земель соглашение не предусматривает.\n\nПосланники ожидают ответа. Совет больше не обладает властью, которая могла бы обеспечить исполнение прежних договорённостей. За новой границей остаются отряды Кроша. Принятие условий сохранит местное управление ценой утраты самостоятельности; отказ означает вооружённое столкновение."
 smesh_krosh.106.a:0 "Принять соглашение о защите."
 smesh_krosh.106.b:0 "Сохранить самостоятельность."
 smesh_krosh.107.t:0 "Соглашение с Ёжиком"
 smesh_krosh.107.d:0 "Подписанный экземпляр соглашения доставлен в дом Кроша. Ёжик принял предложенные условия и признал передачу военных и внешнеполитических полномочий. Его местное управление сохраняется, однако дальнейшие решения по безопасности будут приниматься совместно с представителями Кроша и под их руководством.\n\nНа занятой ранее территории изменений не последовало. Представители сторон приступили к исполнению соглашения. Отрядам Кроша предписано обеспечить новый порядок и воздерживаться от действий, не предусмотренных достигнутыми договорённостями."
 smesh_krosh.107.a:0 "Соглашение вступило в силу."
 smesh_krosh.108.t:0 "Переговоры прекращены"
 smesh_krosh.108.d:0 "Ёжик отказался подписать соглашение. В ответе он подтвердил готовность обсуждать совместную защиту, но отверг передачу своих полномочий и признание занятой Крошем территории. Посланники вернулись с неподписанным документом.\n\nКрош объявил переговоры завершёнными и распорядился начать военные действия. Командованию поручено добиться принятия ранее предъявленных условий. Прежние договорённости между друзьями больше не рассматриваются как достаточное основание для урегулирования."
 smesh_krosh.108.a:0 "Приказ передан отрядам."
 smesh_krosh.110.t:0 "Инцидент у дальнего огорода"
 smesh_krosh.110.d:0 "Во время выдвижения к дальнему огороду передовой отряд Кроша встретил подразделение Копатыча. Представители отряда потребовали пропустить их на участок для обеспечения его охраны и учёта продовольственных запасов. Копатыч ранее не давал согласия на присутствие чужих сил.\n\nПосле отказа стороны заняли позиции у границы. Первые донесения расходятся относительно последовательности столкновения, но подтверждают, что переговоры на месте прекращены. Крош приказал продолжить операцию, ссылаясь на необходимость гарантировать снабжение своих владений.\n\nБоевые действия ограничены районом дальнего огорода. Командованию не дано разрешения распространять их на остальные земли Копатыча."
 smesh_krosh.110.a:0 "Добиться контроля над участком."
 smesh_krosh.111.t:0 "Нарушение границы"
 smesh_krosh.111.d:0 "Копатычу доставили сообщение о появлении отряда Кроша у дальнего огорода. Прибывшие потребовали доступа на участок и передачи его под свою охрану, объяснив это необходимостью продовольственного снабжения. Никакого соглашения о передаче земли заключено не было.\n\nКопатыч распорядился усилить охрану и не допускать чужие силы к грядкам. После столкновения у границы отряд защитников занял позиции вокруг огорода. Обращение с требованием прекратить вторжение направлено Крошу.\n\nПока действия сторон ограничиваются спорным участком. Защитникам предписано удержать огород и не переносить столкновение на соседние земли."
 smesh_krosh.111.a:0 "Участок должен остаться за нами."
 smesh_krosh.112.t:0 "Контроль над дальним огородом"
 smesh_krosh.112.d:0 "Командование подтвердило завершение операции у дальнего огорода. Отряды Копатыча оставили позиции, и участок перешёл под управление Кроша. Назначенные представители приступили к учёту запасов и организации охраны.\n\nКопатыч не признаёт изменения границы. Действия на остальных участках прекращены; распоряжения о продолжении наступления не поступало."
 smesh_krosh.112.a:0 "Обеспечить снабжение и охрану."
 smesh_krosh.113.t:0 "Утрата дальнего огорода"
 smesh_krosh.113.d:0 "Защитники дальнего огорода отступили после завершения пограничного столкновения. Отряды Кроша заняли участок и объявили об установлении собственного управления.\n\nКопатыч потребовал возвращения земли и распорядился принять оставшихся защитников. Военные действия на остальных границах не начались, но прежний порядок доступа к дальнему огороду прекратил существование."
 smesh_krosh.113.a:0 "Мы сохраняем свои права на эту землю."
 smesh_krosh.114.t:0 "Отвод отрядов"
 smesh_krosh.114.d:0 "Операция у дальнего огорода не привела к установлению контроля над участком. Защитники Копатыча удержали позиции, и командование Кроша распорядилось отвести отряды за исходную границу.\n\nПоставленная задача остаётся невыполненной. Продовольственное снабжение придётся обеспечивать другими средствами; приказа о расширении боевых действий не последовало."
 smesh_krosh.114.a:0 "Прекратить операцию."
 smesh_krosh.115.t:0 "Граница удержана"
 smesh_krosh.115.d:0 "Отряды Кроша оставили позиции у дальнего огорода. Защитники сохранили контроль над участком и восстановили охрану подходов.\n\nКопатыч подтвердил, что огород остаётся в его владениях. Подразделениям приказано прекратить преследование за границей и вернуться к обеспечению безопасности участка."
 smesh_krosh.115.a:0 "Восстановить работу огорода."
 smesh_krosh.116.t:0 "Прекращение столкновения"
 smesh_krosh.116.d:0 "Пограничная операция у дальнего огорода прекращена без изменения границы. Отряды Кроша получили приказ оставить передовые позиции.\n\nУчасток остаётся под управлением Копатыча. Стороны не достигли соглашения о снабжении, но дальнейшее расширение военных действий не предусмотрено."
 smesh_krosh.116.a:0 "Отвести отряды."
 smesh_krosh.117.t:0 "Прекращение столкновения"
 smesh_krosh.117.d:0 "Столкновение у дальнего огорода прекращено. Его территория осталась под управлением Копатыча, и охрана получила приказ восстановить прежний порядок доступа.\n\nВоенное прекращение операции не разрешило спор между сторонами. Копатыч подтвердил свои права на участок и потребовал согласовывать любые дальнейшие обращения через представителей."
 smesh_krosh.117.a:0 "Сохранить охрану границы."
 smesh_krosh.121.t:0 "Распад Ромашковой долины"
 smesh_krosh.121.d:0 "Последнее заседание общего Совета завершилось без принятия решений, обязательных для всех жителей. Представители покидали зал с документами, которые отныне предстояло исполнять на собственных землях. Прежний порядок совместного управления прекратил существование.\n\nКрош, Ёжик, Нюша, Бараш, Лосяш, Совунья, Копатыч, Пин и Кар-Карыч получили самостоятельность. Общий союз распущен. Совет сохранил управление центральной территорией и участками, переданными ему до распада.\n\nНовые границы и распределение полномочий больше не обеспечены общими договорённостями. Каждому правителю предстоит самостоятельно решать вопросы защиты, снабжения и отношений с соседями. Миссия НАТО продолжает наблюдение с острова."
 smesh_krosh.121.a:0 "Общий порядок прекратил существование."
