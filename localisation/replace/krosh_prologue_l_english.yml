l_english:
 KRO_project_skameika:0 "Project S.K.A.M.E.Y.K.A"
 KRO_project_skameika_desc:0 "The valley needs a permanent place for rest and public meetings. Preparing the site, obtaining timber and delivering materials will require coordinated work. The deadline must be met: completion will demonstrate that organised labour can provide for the entire valley."
 KRO_project_skameika_tt:0 "Complete the bench. Valley residents gain 3% stability and Krosh gains 25 political power. All active countries receive the literary record."
 KRO_property_dispute:0 "The Question of Ownership"
 KRO_property_dispute_desc:0 "The Council intends to register the bench as public property, citing the residents' contribution and its importance for common recreation. Together with Yozhik we will demand that the original ownership be respected. Free public access does not transfer the right to dispose of the property."
 KRO_property_dispute_tt:0 "The protest is rejected. The Council moves the bench to a public site near Yozhik's home without his consent. All active countries receive the record."
 KRO_leave_council:0 "Withdraw from the Council"
 KRO_leave_council_desc:0 "The institution entrusted with reconciling the residents' interests has confirmed a decision that violates our rights. Continued participation would recognise this arrangement. We will withdraw our representation and concentrate on our own lands. Common obligations remain, but the Council's right to speak for us is no longer recognised."
 KRO_leave_council_tt:0 "Krosh withdraws from Council meetings and returns home. Subject status and faction membership continue until the breakup. Only Krosh receives the personal record."
 KRO_reclaim_bench:0 "Settle the Bench Question"
 KRO_reclaim_bench_desc:0 "Negotiations have failed to restore our rights. Krosh's supporters will leave the northern district to the Council and assemble near the bench. We will establish control over the surrounding territory and propose recognition of the new border as the final settlement of the dispute."
 KRO_reclaim_bench_tt:0 "Cede the northeastern district to the Council and occupy Yozhik's southern districts containing the bench. Yozhik's home remains outside the occupation. All active countries receive the record."
 KRO_security_guarantees:0 "Security Guarantees"
 KRO_security_guarantees_desc:0 "The end of common government will leave the residents without agreed arrangements for defence and supply. Yozhik will be offered an agreement transferring military and foreign affairs authority to Krosh. At the same time our forces will move towards Kopatych's distant garden, considered essential for a reliable food supply."
 KRO_security_guarantees_tt:0 "After the breakup, simultaneously send Yozhik an offer and begin a border conflict over the distant garden. Acceptance makes Yozhik Krosh's puppet; refusal leads to war. The garden changes hands only if Krosh wins. Each diplomatic record goes only to its participants."
 smesh_fixed_breakup_tt:0 "The common faction dissolves 70 days after the new campaign begins, independently of national focus selection."
 smesh_ezh_accept_tt:0 "Yozhik becomes Krosh's puppet. The territories already occupied by Krosh are not returned."
 smesh_ezh_refuse_tt:0 "Krosh declares war on Yozhik. The border conflict with Kopatych develops independently."
 smesh_former_bench_site:0 "Construction Site"
 smesh_bench_name:0 "S.K.A.M.E.Y.K.A"
 smesh_krosh.101.t:0 "The Opening of S.K.A.M.E.Y.K.A"
 smesh_krosh.101.d:0 "The last work was completed shortly before noon. Remaining planks were removed, borrowed tools returned, and stones laid along the approach to keep the path usable after rain. Krosh inspected the fittings once more and informed Yozhik that the opening would not be postponed again.\n\nConstruction had demanded considerably more effort than expected. Bad weather repeatedly delayed timber deliveries. Some pieces had to be replaced and the foundations prepared again. Kopatych supplied materials, Pin provided tools, and the other residents took turns working. Krosh remained on the site until evening even when everyone else had been sent home.\n\nAlmost everyone attended the opening. Yozhik read a report confirming completion of the construction plan and handed Krosh the expense records. The barriers were removed. Residents stayed after the ceremony, discussing news, arranging joint work and resting before returning home.\n\nThat evening Krosh placed the construction records in a separate folder. His name remained on its cover. In the Council minutes prepared that same day, the completed project was entered on the list of facilities of public importance."
 smesh_krosh.101.a:0 "Our work has benefited the valley."
 smesh_krosh.102.t:0 "The Resolution Has Passed"
 smesh_krosh.102.d:0 "The Council secretary read the resolution nationalising the bench and its public site. The document ordered its registration, an inventory, and the transfer of maintenance to appointed officials. Public participation in construction and equal access were cited as the grounds.\n\nYozhik presented their objections and construction records. Krosh confirmed that access would remain free but demanded removal of the ownership transfer. The chairman acknowledged their contribution and stated that the facility's public purpose took precedence.\n\nThe protest was rejected. While Krosh continued to demand reconsideration, signed copies were already being handed to the officials. By evening the bench had been moved to a public site near Yozhik's home. His consent was not requested.\n\nOnly fitting marks and the construction barriers remained at the original site. Krosh collected his folder and left, refusing to sign the transfer document."
 smesh_krosh.102.a:0 "The resolution has entered into force."
 smesh_krosh.103.t:0 "Withdrawal from the Council"
 smesh_krosh.103.d:0 "At his last meeting Krosh handed the chairman a statement ending his participation in the Council. He demanded that the minutes record his rejection of nationalisation and of the Council's right to dispose of his property. The chairman proposed further discussion through established procedures. Krosh left the statement on the table and walked out.\n\nAt home he put the Council documents in a separate drawer. Yozhik arrived that evening and urged him to return to negotiations. Krosh listened but replied that attending meetings now merely legitimised decisions taken without his consent.\n\nAfter Yozhik left, the door was locked. The common faction still existed and obligations to the centre formally remained. No separation had been declared. Nevertheless, Krosh's place at the next meeting stood empty. Further Council correspondence was delivered to a closed house."
 smesh_krosh.103.a:0 "The Council no longer represents our interests."
 smesh_krosh.104.t:0 "The Situation on the Ground"
 smesh_krosh.104.d:0 "The relocation of Krosh's supporters from the northern district was completed by dawn. Council representatives received the remaining documents and were informed that administration had passed to the centre. The main detachments were already advancing towards the site near Yozhik's home.\n\nYozhik came out when new border markers appeared along the road. The marked boundary extended well beyond the bench itself. When he demanded an explanation, he was shown Krosh's order establishing a single administration over the site and surrounding land. His home remained outside the new boundary.\n\nIn an address to his neighbours, Krosh declared that recovering the property had restored his violated rights. The northern cession was presented as a concession towards a general settlement. He proposed recognition of the boundary and assured them that this would conclude the dispute.\n\nThe Council refrained from intervention. Yozhik lodged a protest, but Krosh's detachments had already secured the territory. The bench remained on its site; the administration of the land around it had changed."
 smesh_krosh.104.a:0 "A new boundary has been established."
 smesh_krosh.105.t:0 "The Protection Offer Has Been Sent"
 smesh_krosh.105.d:0 "Following the end of common government, Krosh ordered the preparation of a security agreement with Yozhik. Local administration would be retained, while defence and foreign affairs passed to Krosh. The previously occupied territory would be recognised as part of his possessions.\n\nHis representatives delivered the agreement to Yozhik's home. They were instructed to obtain a definite answer: acceptance would establish coordinated defence, while refusal would be regarded as the end of peaceful negotiations.\n\nDetachments also advanced towards Kopatych's distant garden. Food supply is treated separately and does not depend on the outcome of the talks with Yozhik."
 smesh_krosh.105.a:0 "We await an answer."
 smesh_krosh.106.t:0 "Krosh's Proposal"
 smesh_krosh.106.d:0 "Krosh's envoys brought the prepared agreement. Yozhik read it at the same table where they had recently drafted their protest against nationalisation. This document concerned the right to administer his lands independently.\n\nKrosh offers protection in return for control over defence and foreign affairs, together with recognition of the boundary established after the southern occupation. The agreement provides for no return of those territories.\n\nThe envoys await an answer. The Council no longer has authority to enforce previous arrangements. Krosh's detachments remain beyond the new boundary. Acceptance preserves local administration at the cost of independence; refusal means armed conflict."
 smesh_krosh.106.a:0 "Accept the protection agreement."
 smesh_krosh.106.b:0 "Retain our independence."
 smesh_krosh.107.t:0 "Agreement with Yozhik"
 smesh_krosh.107.d:0 "The signed agreement has arrived at Krosh's home. Yozhik accepted the terms and recognised the transfer of military and foreign affairs authority. His local administration remains, but security decisions will now be taken under Krosh's representatives.\n\nThe previously occupied territory has not changed hands. Representatives have begun implementing the agreement. Krosh's detachments are to maintain the new arrangements and refrain from actions beyond the agreed terms."
 smesh_krosh.107.a:0 "The agreement has entered into force."
 smesh_krosh.108.t:0 "Negotiations Have Ended"
 smesh_krosh.108.d:0 "Yozhik refused to sign. His reply expressed willingness to discuss joint protection but rejected the transfer of authority and recognition of the occupied territory. The envoys returned with the unsigned document.\n\nKrosh declared negotiations over and ordered military operations to begin. The command is to secure acceptance of the demands. The friends' previous arrangements are no longer considered sufficient for a settlement."
 smesh_krosh.108.a:0 "The order has reached our detachments."
 smesh_krosh.110.t:0 "Incident at the Distant Garden"
 smesh_krosh.110.d:0 "While advancing towards the distant garden, Krosh's forward detachment encountered Kopatych's troops. Its representatives demanded entry to secure the site and inventory its food stocks. Kopatych had not consented to the presence of foreign forces.\n\nFollowing a refusal, both sides took positions along the border. Initial reports disagree on the sequence of the clash but confirm that local negotiations have ceased. Krosh ordered the operation to continue, citing the need to guarantee supplies.\n\nFighting is confined to the distant garden. The command has no permission to extend it to Kopatych's other territories."
 smesh_krosh.110.a:0 "Secure control over the site."
 smesh_krosh.111.t:0 "A Border Violation"
 smesh_krosh.111.d:0 "Kopatych received a report that Krosh's detachment had appeared at the distant garden. The arrivals demanded entry and control of the site, invoking their food supply needs. No agreement to transfer the land had been concluded.\n\nKopatych ordered the guards reinforced and foreign troops kept away from the garden. Following the clash, defenders took positions around the site. A demand to end the incursion has been sent to Krosh.\n\nOperations remain confined to the disputed area. The defenders are to hold the garden without extending the clash into neighbouring lands."
 smesh_krosh.111.a:0 "The garden must remain ours."
 smesh_krosh.112.t:0 "Control over the Distant Garden"
 smesh_krosh.112.d:0 "The command has confirmed completion of the operation. Kopatych's detachments abandoned their positions and the garden passed under Krosh's administration. Appointed representatives have begun registering stocks and organising security.\n\nKopatych does not recognise the new boundary. Operations elsewhere have ceased; no order for a further advance has been issued."
 smesh_krosh.112.a:0 "Organise supplies and security."
 smesh_krosh.113.t:0 "Loss of the Distant Garden"
 smesh_krosh.113.d:0 "The defenders withdrew after the border clash. Krosh's detachments occupied the garden and announced their own administration.\n\nKopatych demanded its return and ordered the surviving defenders received. No fighting has begun elsewhere, but previous access to the distant garden has ended."
 smesh_krosh.113.a:0 "We retain our rights to this land."
 smesh_krosh.114.t:0 "Withdrawal of the Detachments"
 smesh_krosh.114.d:0 "The operation failed to secure control of the distant garden. Kopatych's defenders held their positions and Krosh's command ordered a withdrawal behind the original boundary.\n\nThe objective remains unfulfilled. Food supplies must be secured by other means; no expansion of hostilities has been ordered."
 smesh_krosh.114.a:0 "End the operation."
 smesh_krosh.115.t:0 "The Border Has Held"
 smesh_krosh.115.d:0 "Krosh's detachments abandoned their positions near the distant garden. The defenders retained the site and restored control of its approaches.\n\nKopatych confirmed that the garden remains in his possession. His troops have been ordered to stop pursuit beyond the boundary and return to guarding the site."
 smesh_krosh.115.a:0 "Resume work in the garden."
 smesh_krosh.116.t:0 "The Clash Has Ended"
 smesh_krosh.116.d:0 "The border operation has ended without a change to the boundary. Krosh's detachments have been ordered to leave their forward positions.\n\nThe garden remains under Kopatych's administration. No supply agreement has been reached, but no further military escalation is authorised."
 smesh_krosh.116.a:0 "Withdraw the detachments."
 smesh_krosh.117.t:0 "The Clash Has Ended"
 smesh_krosh.117.d:0 "The clash at the distant garden has ended. Its territory remains under Kopatych's administration and the guards are to restore the previous access arrangements.\n\nEnding the operation has not resolved the dispute. Kopatych has reaffirmed his rights and demanded that any further approaches be made through representatives."
 smesh_krosh.117.a:0 "Maintain the border guards."
 smesh_krosh.121.t:0 "The Breakup of Romashkova Valley"
 smesh_krosh.121.d:0 "The last meeting of the common Council ended without decisions binding all residents. Representatives left with documents that would henceforth be implemented on their own lands. The previous system of joint government has ended.\n\nKrosh, Yozhik, Nyusha, Barash, Losyash, Sovunya, Kopatych, Pin and Kar-Karych gained independence. The common faction has dissolved. The Council retained the central territory and districts ceded to it before the breakup.\n\nBoundaries and authority are no longer guaranteed by common arrangements. Each ruler must settle defence, supply and relations with neighbours independently. The NATO Mission continues observing from its island."
 smesh_krosh.121.a:0 "The common order has ended."
